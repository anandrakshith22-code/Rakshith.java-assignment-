services:
  - type: web
    name: marketflow-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        value: https://ephemeral-phoenix-864cb4.netlify.app
